[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "czsc-trader-research"
version = "0.1.0"
description = "Causal CZSC and vectorbt research pipeline for 588080.SH"
requires-python = ">=3.12"
dependencies = [
    "czsc==1.0.1",
    "czsc-dataflows==0.1.0",
    "czsc-factor-signal-catalog==0.1.0",
    "czsc-strategy-evaluator==0.1.0",
    "czsc-strategy-manager==0.1.0",
    "czsc-strategy-template-catalog==0.1.0",
    "vectorbt==1.1.0",
    "pandas>=3.0.3,<4",
    "numpy>=2.4.6",
    "joblib>=1.5,<2",
    "optuna==4.9.0",
    "plotly==6.9.0",
    "python-dotenv>=1.0.0",
    "tsfresh==0.21.1",
]

[project.scripts]
czsc-trader = "czsc_trader.cli.main:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/functional"]
addopts = "--tb=short -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".tmp/ruff/cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
