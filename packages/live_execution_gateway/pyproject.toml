[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "czsc-live-execution-gateway"
version = "0.1.0"
description = "Fail-closed Longbridge US-stock live execution gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "czsc-dataflows==0.1.0",
    "paper-trading-engine==0.1.0",
    "longbridge==5.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
longbridge-live = "live_execution_gateway.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/functional"]
addopts = "--tb=short -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
