[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "czsc-trader-research"
version = "0.1.0"
description = "Causal CZSC and vectorbt research pipeline for 588080.SH"
requires-python = ">=3.12"
dependencies = [
    "czsc==1.0.1",
    "vectorbt==1.1.0",
    "pandas>=3.0.3,<4",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --tb=short"

